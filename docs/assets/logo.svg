<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">AgentBridge logo — شعار AgentBridge</title>
  <desc id="d">A bridge arc connecting a specification document to an MCP server block — قوس جسر يصل وثيقة مواصفة بكتلة خادم MCP</desc>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#0E9F8A"/>
    </linearGradient>
    <linearGradient id="abg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#0E9F8A"/>
    </linearGradient>
  </defs>
  <!-- ground baseline — خط الأرض -->
  <line x1="56" y1="420" x2="456" y2="420" stroke="#0F2B46" stroke-width="18" stroke-linecap="round"/>
  <!-- left pillar: specification document — الركية اليسرى: وثيقة المواصفة -->
  <rect x="96" y="196" width="128" height="224" rx="24" fill="#0F4C81"/>
  <line x1="128" y1="252" x2="192" y2="252" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="128" y1="296" x2="192" y2="296" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="128" y1="340" x2="176" y2="340" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <!-- right pillar: MCP server block — الركية اليمنى: كتلة خادم MCP -->
  <rect x="288" y="196" width="128" height="224" rx="24" fill="#0E9F8A"/>
  <rect x="320" y="244" width="64" height="64" rx="14" fill="#FFFFFF"/>
  <line x1="330" y1="230" x2="330" y2="244" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="352" y1="230" x2="352" y2="244" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="374" y1="230" x2="374" y2="244" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="330" y1="308" x2="330" y2="322" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="352" y1="308" x2="352" y2="322" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <line x1="374" y1="308" x2="374" y2="322" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <!-- bridge arc — قوس الجسر -->
  <path d="M160 150 C 208 74, 304 74, 352 150" fill="none" stroke="url(#abg2)" stroke-width="30" stroke-linecap="round"/>
  <!-- data dots crossing the bridge — نقاط بيانات تعبر الجسر -->
  <circle cx="200" cy="112" r="14" fill="#0F2B46"/>
  <circle cx="256" cy="96" r="14" fill="#0F2B46"/>
  <circle cx="312" cy="112" r="14" fill="#0F2B46"/>
</svg>
