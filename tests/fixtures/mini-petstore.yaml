# Petstore مصغر — التركيبة المرجعية لاختبارات الاستيعاب والتحليل
# يغطي: YAML، مراجع $ref داخلية، أمان عام وخاص، معاملات مسار واستعلام، أجسام طلب
openapi: "3.0.3"
info:
  title: "Mini Petstore"
  version: "1.0.0"
security:
  - petstore_auth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: "List all pets"
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: "A list of pets"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"
    post:
      operationId: createPet
      summary: "Create a pet"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: "Pet created"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: showPetById
      summary: "Get one pet by id"
      responses:
        "200":
          description: "The pet"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      summary: "Remove a pet"
      responses:
        "204":
          description: "Deleted"
  /health:
    get:
      operationId: getHealth
      summary: "Service heartbeat"
      security: []
      responses:
        "200":
          description: "OK"
components:
  # كان السجل الأمني يراجع petstore_auth دون تعريف — مرجع معلق.
  # صُحح التعريف بتدفق مدعوم (clientCredentials) ليبقى مرجعياً في حدود الدعم.
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "https://auth.example.com/oauth/token"
          scopes: {}
  schemas:
    Category:
      type: object
      properties:
        name:
          type: string
        vetContactEmail:
          type: string
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
        ownerPhone:
          type: string
        category:
          $ref: "#/components/schemas/Category"
    Pet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        ownerCreditCard:
          type: string
    PetList:
      type: array
      items:
        $ref: "#/components/schemas/Pet"
