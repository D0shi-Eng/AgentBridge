<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">AgentBridge monogram — علامة AgentBridge المختصرة</title>
  <desc id="d">Letters AB on a gradient rounded square — حرفا AB على مربع مستدير متدرج</desc>
  <defs>
    <linearGradient id="abm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F4C81"/>
      <stop offset="1" stop-color="#0E9F8A"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#abm)"/>
  <!-- A — hand-drawn strokes, no font dependency -->
  <path d="M78 384 L172 128 L266 384" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="116" y1="296" x2="228" y2="296" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <!-- B — stem plus two rounded bowls -->
  <line x1="318" y1="146" x2="318" y2="384" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <path d="M318 146 h64 a70 70 0 0 1 0 140 h-64" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M318 286 h80 a68 68 0 0 1 0 98 h-80" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
